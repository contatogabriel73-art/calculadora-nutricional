<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — NutriBloom</title>
<meta name="theme-color" content="#A8B5A0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="plataforma.css">
</head>
<body class="protegida">

<header id="app-shell"></header>

<main class="wrap painel">

  <!-- ═══════ Cabeçalho ═══════ -->
  <div class="painel-topo">
    <h1 id="saudacao"></h1>
    <p id="resumo-dia" class="painel-sub"></p>
  </div>

  <!-- ═══════ Métricas ═══════ -->
  <section class="faixa-metricas" id="metricas" aria-label="Resumo"></section>

  <!-- ═══════ Corpo em duas colunas ═══════ -->
  <div class="painel-grade">

    <section class="bloco" aria-labelledby="t-agenda">
      <div class="bloco-topo">
        <h2 id="t-agenda">Agenda</h2>
        <a class="link-discreto" href="agenda.html">Ver tudo</a>
      </div>
      <div id="agenda-dias"></div>
      <p id="sem-agenda" class="vazio-suave" hidden>
        Nenhuma consulta nos próximos dias.
      </p>
    </section>

    <aside class="painel-lado">

      <section class="bloco" aria-labelledby="t-acoes">
        <div class="bloco-topo"><h2 id="t-acoes">Ações rápidas</h2></div>
        <nav id="atalhos" class="atalhos"></nav>
      </section>

      <section class="bloco" id="bloco-pendencias" aria-labelledby="t-pend" hidden>
        <div class="bloco-topo">
          <h2 id="t-pend">Cobranças em aberto</h2>
          <a class="link-discreto" href="financeiro.html">Ver tudo</a>
        </div>
        <p class="total-aberto" id="total-aberto"></p>
        <ul id="lista-pendencias" class="lista-simples"></ul>
      </section>

    </aside>
  </div>

  <div id="aviso"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/pacientes-storage.js"></script>
<script src="js/agenda-storage.js"></script>
<script src="js/financeiro-storage.js"></script>
<script src="js/perfil-storage.js"></script>
<script src="js/shell.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
